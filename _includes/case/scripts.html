<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1. Tab Swapping Logic
    const tabButtons = document.querySelectorAll('.tab-btn');
    const contentPanels = document.querySelectorAll('.tab-content-panel');

    tabButtons.forEach(button => {
      button.addEventListener('click', function () {
        const targetId = this.getAttribute('data-target');

        // Remove active state from all buttons and panels
        tabButtons.forEach(btn => {
          btn.classList.remove('active');
          btn.setAttribute('aria-selected', 'false');
        });
        contentPanels.forEach(panel => panel.classList.remove('active'));

        // Activate clicked tab
        this.classList.add('active');
        this.setAttribute('aria-selected', 'true');
        const activePanel = document.getElementById(targetId);
        if (activePanel) {
          activePanel.classList.add('active');
        }

        // 2. Leaflet Map Resize Invalidation Fix
        if (targetId === 'tab-where' && window.miniMap) {
          setTimeout(() => {
            window.miniMap.invalidateSize();
            if (window.mapBounds) {
              window.miniMap.fitBounds(window.mapBounds, { padding: [15, 15], maxZoom: 10 });
            }
          }, 100);
        }
      });
    });

    // 3. Mini Map Loader
    var mapMarkers = [
      // Lead Organisations
      {% if page['lead-organisations'] %}
        {% for org_slug in page['lead-organisations'] %}
  {% assign org = site.organisations | where: "slug", org_slug | first %}
  {% if org and org['main-location'] %}
  {% for loc_slug in org['main-location'] %}
  {% assign loc = site.locations | where: "slug", loc_slug | first %}
  {% if loc and loc.latitude and loc.longitude %}
  {
    lat: parseFloat("{{ loc.latitude }}"),
    lng: parseFloat("{{ loc.longitude }}"),
    title: "{{ org.title | escape }} (Lead)",
      color: "#496a40",
        radius: 7,
          weight: 2
  },
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}
  {% endif %}

  // Involved Organisations
  {% if page['involved-organisations'] %}
  {% for org_slug in page['involved-organisations'] %}
  {% assign org = site.organisations | where: "slug", org_slug | first %}
  {% if org and org['main-location'] %}
  {% for loc_slug in org['main-location'] %}
  {% assign loc = site.locations | where: "slug", loc_slug | first %}
  {% if loc and loc.latitude and loc.longitude %}
  {
    lat: parseFloat("{{ loc.latitude }}"),
    lng: parseFloat("{{ loc.longitude }}"),
    title: "{{ org.title | escape }} (Involved)",
      color: "#8fa68b",
        radius: 4.5,
          weight: 1.5
  },
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}
  {% endif %}

  // Participants
  {% if page.participants %}
  {% for part_slug in page.participants %}
  {% assign part = site.participants | where: "slug", part_slug | first %}
  {% if part and part.locations %}
  {% for loc_slug in part.locations %}
  {% assign loc = site.locations | where: "slug", loc_slug | first %}
  {% if loc and loc.latitude and loc.longitude %}
  {
    lat: parseFloat("{{ loc.latitude }}"),
    lng: parseFloat("{{ loc.longitude }}"),
    title: "{{ part.title | escape }} (Participants)",
      color: "#e67e22",
        radius: 5.5,
          weight: 1.5
  },
  {% endif %}
  {% endfor %}
  {% endif %}
  {% endfor %}
  {% endif %}
    ];

  const mapContainer = document.getElementById('case-mini-map');
  if (mapContainer && mapMarkers.length > 0) {
    // Initialize Map inside global window scope so tab logic can access it
    window.miniMap = L.map('case-mini-map', {
      zoomControl: true,
      attributionControl: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }).addTo(window.miniMap);

    window.mapBounds = L.latLngBounds();

    mapMarkers.forEach(function (m) {
      var marker = L.circleMarker([m.lat, m.lng], {
        radius: m.radius,
        fillColor: m.color,
        color: "#ffffff",
        weight: m.weight,
        opacity: 1,
        fillOpacity: 0.85
      }).addTo(window.miniMap);

      marker.bindPopup("<strong style='font-family:Plus Jakarta Sans, sans-serif; font-size:11px;'>" + m.title + "</strong>");
      window.mapBounds.extend([m.lat, m.lng]);
    });

    // Fit bounds after initial setup
    setTimeout(function () {
      window.miniMap.invalidateSize();
      window.miniMap.fitBounds(window.mapBounds, { padding: [15, 15], maxZoom: 10 });
    }, 150);
  } else if (mapContainer) {
    // Hide map container if there are no coordinates to plot
    mapContainer.parentElement.innerHTML = "<div class='locations-summary-card' style='height: 100%; display: flex; align-items: center; justify-content: center; color: #7a9476; font-style: italic;'>No map data available for this case.</div>";
  }

  // Initialize Printable Mini Map
  const printMapContainer = document.getElementById('print-mini-map');
  if (printMapContainer && mapMarkers.length > 0) {
    window.printMiniMap = L.map('print-mini-map', {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false
    }).setView([20, 0], 2);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 20
    }).addTo(window.printMiniMap);

    window.printMapBounds = L.latLngBounds();

    mapMarkers.forEach(function (m) {
      L.circleMarker([m.lat, m.lng], {
        radius: Math.max(3, m.radius - 1.5),
        fillColor: m.color,
        color: "#ffffff",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.85
      }).addTo(window.printMiniMap);
      window.printMapBounds.extend([m.lat, m.lng]);
    });

    setTimeout(function () {
      window.printMiniMap.invalidateSize();
      window.printMiniMap.fitBounds(window.printMapBounds, { padding: [10, 10], maxZoom: 10 });
    }, 250);
  } else if (printMapContainer) {
    printMapContainer.style.display = 'none';
  }
  // 4. Gallery scroll & lightbox
  const galleryTrack = document.getElementById('gallery-track');
  const galleryPrev = document.getElementById('gallery-prev');
  const galleryNext = document.getElementById('gallery-next');

  if (galleryTrack) {
    const scrollAmount = () => galleryTrack.offsetWidth * 0.65;

    if (galleryPrev) galleryPrev.addEventListener('click', () => {
      galleryTrack.scrollBy({ left: -scrollAmount(), behavior: 'smooth' });
    });
    if (galleryNext) galleryNext.addEventListener('click', () => {
      galleryTrack.scrollBy({ left: scrollAmount(), behavior: 'smooth' });
    });

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close');

    galleryTrack.querySelectorAll('.gallery-thumb-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        lightboxImg.src = btn.dataset.full;
        lightboxImg.alt = btn.dataset.caption || '';
        lightboxCaption.textContent = btn.dataset.caption || '';
        lightbox.style.display = 'flex';
        document.body.style.overflow = 'hidden';
      });
    });

    if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
    if (lightbox) lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });

    function closeLightbox() {
      lightbox.style.display = 'none';
      document.body.style.overflow = '';
    }
  }

  // 5. Message carousel
  const msgTrack = document.getElementById('msg-track');
  const msgPrev = document.getElementById('msg-prev');
  const msgNext = document.getElementById('msg-next');

  if (msgTrack) {
    const slides = msgTrack.querySelectorAll('.msg-slide');
    let msgIndex = 0;

    function goToMsg(idx) {
      msgIndex = (idx + slides.length) % slides.length;
      msgTrack.style.transform = `translateX(-${msgIndex * 100}%)`;
    }

    if (msgPrev) msgPrev.addEventListener('click', () => goToMsg(msgIndex - 1));
    if (msgNext) msgNext.addEventListener('click', () => goToMsg(msgIndex + 1));
  }

  // 6. Learn More Tab Switcher Logic
  const learnMoreButtons = document.querySelectorAll('.learn-more-btn');
  learnMoreButtons.forEach(btn => {
    btn.addEventListener('click', function () {
      const targetTab = this.getAttribute('data-tab');
      const tabBtn = document.querySelector(`.tab-btn[data-target="${targetTab}"]`);
      if (tabBtn) {
        tabBtn.click();
        const tabButtonsContainer = document.querySelector('.tab-buttons-container');
        if (tabButtonsContainer) {
          tabButtonsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // Tab Switcher Links (e.g. inline links inside paragraph content)
  const tabSwitcherLinks = document.querySelectorAll('.tab-switcher-link');
  tabSwitcherLinks.forEach(link => {
    link.addEventListener('click', function (e) {
      e.preventDefault();
      const targetTab = this.getAttribute('data-tab');
      const tabBtn = document.querySelector(`.tab-btn[data-target="${targetTab}"]`);
      if (tabBtn) {
        tabBtn.click();
        const tabButtonsContainer = document.querySelector('.tab-buttons-container');
        if (tabButtonsContainer) {
          tabButtonsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });

  // 7. Print Draft Preview Logic
  const triggerPrintBtn = document.getElementById('trigger-print-preview-btn');
  const closePrintBtn = document.getElementById('print-cancel-btn');
  const printNowBtn = document.getElementById('print-now-btn');
  const fontIncreaseBtn = document.getElementById('print-font-increase');
  const fontDecreaseBtn = document.getElementById('print-font-decrease');
  const printContainer = document.getElementById('print-draft-container');

  const overflowPairs = [
    { box: 'print-box-what', indicator: 'print-box-what-more' },
    { box: 'print-box-inclusion', indicator: 'print-box-inclusion-more' },
    { box: 'print-box-limitations', indicator: 'print-box-limitations-more' }
  ];

  function checkOverflow(boxId, indicatorId) {
    const box = document.getElementById(boxId);
    const indicator = document.getElementById(indicatorId);
    if (box && indicator) {
      const isOverflowing = box.scrollHeight > box.clientHeight + 2;
      if (isOverflowing) {
        indicator.classList.add('visible');
      } else {
        indicator.classList.remove('visible');
      }
    }
  }

  // Define global check runner so print resize triggers can access it
  window.runAllOverflowChecks = function () {
    overflowPairs.forEach(p => checkOverflow(p.box, p.indicator));
  };

  function initOverflowCheckers() {
    overflowPairs.forEach(p => {
      const boxEl = document.getElementById(p.box);
      if (boxEl) {
        checkOverflow(p.box, p.indicator);
        boxEl.addEventListener('input', () => checkOverflow(p.box, p.indicator));
        boxEl.addEventListener('keyup', () => checkOverflow(p.box, p.indicator));
        boxEl.addEventListener('mouseup', () => checkOverflow(p.box, p.indicator));
        boxEl.addEventListener('blur', () => checkOverflow(p.box, p.indicator));
        boxEl.addEventListener('paste', () => {
          setTimeout(() => checkOverflow(p.box, p.indicator), 50);
        });
      }
    });
  }

  if (triggerPrintBtn) {
    triggerPrintBtn.addEventListener('click', function () {
      const qrImg = document.getElementById('print-qr-code-img');
      if (qrImg && (!qrImg.getAttribute('src') || qrImg.getAttribute('src') === '')) {
        const pageUrl = qrImg.getAttribute('data-url') || window.location.href;
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(pageUrl)}`;
      }
      document.body.classList.add('print-mode-active');
      window.scrollTo(0, 0);

      // Resize the print mini-map once container is visible
      if (window.printMiniMap && window.printMapBounds) {
        setTimeout(function () {
          window.printMiniMap.invalidateSize();
          window.printMiniMap.fitBounds(window.printMapBounds, { padding: [10, 10], maxZoom: 10 });
        }, 100);
      }

      // Initialize overflow checkers once containers are visible
      setTimeout(function () {
        initOverflowCheckers();
      }, 150);
    });
  }

  if (closePrintBtn) {
    closePrintBtn.addEventListener('click', function () {
      document.body.classList.remove('print-mode-active');
    });
  }

  if (printNowBtn) {
    printNowBtn.addEventListener('click', function () {
      window.print();
    });
  }

  let printBaseSizeVal = 10.0;
  if (fontIncreaseBtn && printContainer) {
    fontIncreaseBtn.addEventListener('click', function () {
      printBaseSizeVal += 0.5;
      printContainer.style.setProperty('--print-base-size', `${printBaseSizeVal}pt`);
      setTimeout(window.runAllOverflowChecks, 50);
    });
  }

  if (fontDecreaseBtn && printContainer) {
    fontDecreaseBtn.addEventListener('click', function () {
      printBaseSizeVal -= 0.5;
      printContainer.style.setProperty('--print-base-size', `${printBaseSizeVal}pt`);
      setTimeout(window.runAllOverflowChecks, 50);
    });
  }

  // 8. Read More Toggle Logic
  const readMoreTriggers = document.querySelectorAll('.read-more-trigger');
  readMoreTriggers.forEach(trigger => {
    trigger.addEventListener('click', function () {
      const container = this.closest('.read-more-container');
      if (container) {
        const expandedDiv = container.querySelector('.read-more-expanded');
        if (expandedDiv) {
          const isHidden = expandedDiv.style.display === 'none';
          if (isHidden) {
            expandedDiv.style.display = 'block';
            this.textContent = 'Read less';
            this.setAttribute('aria-expanded', 'true');
          } else {
            expandedDiv.style.display = 'none';
            this.textContent = 'Read more';
            this.setAttribute('aria-expanded', 'false');
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        }
      }
    });
  });
  });
</script>
