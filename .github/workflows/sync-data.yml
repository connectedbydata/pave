name: Sync Data from Airtable

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv pyairtable

      - name: Run sync scripts
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python scripts/sync_schema.py
          python scripts/sync_data.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: Sync latest updates from Airtable"
          branch: airtable-sync
          delete-branch: true
          title: "Data Sync: Latest updates from Airtable"
          body: |
            This is an automated PR to sync the latest data and images from Airtable.
            
            Verified:
            - Updated schemas
            - Downloaded new attachments/thumbnails
            - Obfuscated IDs and filenames
          labels: |
            data sync
            automated
