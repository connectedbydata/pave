name: Deploy to Mythic Beasts (Pallas)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pallas-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv pyairtable

      - name: Run Airtable Sync
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          python scripts/sync_data.py

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Setup SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PALLAS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H pallas.mythic-beasts.com >> ~/.ssh/known_hosts

      - name: Deploy via Rsync
        env:
          SSH_USER: ${{ secrets.PALLAS_SSH_USER || 'practical' }}
          REMOTE_DIR: ${{ secrets.PALLAS_REMOTE_DIR || '/home/practical/www/pave-live.pairs.site' }}
        run: |
          rsync -avz --delete _site/ ${SSH_USER}@pallas.mythic-beasts.com:${REMOTE_DIR}/
