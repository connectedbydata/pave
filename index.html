<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <link rel="canonical" href="https://pave.pairs.site/">
    <script>
      var path = window.location.pathname.replace(/^\/pave/, '');
      if (!path.startsWith('/')) {
        path = '/' + path;
      }
      window.location.replace("https://pave.pairs.site" + path + window.location.search + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=https://pave.pairs.site/">
  </head>
  <body>
    <p>This page has moved. Please wait or <a href="https://pave.pairs.site/">click here</a> to be redirected.</p>
  </body>
</html>
