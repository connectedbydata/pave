---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    <div class="case-fields">
      {% for field in page %}
        {% if field[0] contains "fld" %}
          <div class="field-container">
            <label class="field-label">{{ field[0] }}</label>
            <div class="field-value">
              {% if field[1].first %}
                <ul>
                  {% for item in field[1] %}
                    <li>{{ item }}</li>
                  {% endfor %}
                </ul>
              {% else %}
                {{ field[1] }}
              {% endif %}
            </div>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>
</article>

<style>
.field-container {
  margin-bottom: 1rem;
}
.field-label {
  font-weight: bold;
}
</style>
